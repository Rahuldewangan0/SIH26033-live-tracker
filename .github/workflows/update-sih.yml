name: Update SIH Submission Count

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch SIH page
        run: |
          python - <<'PY'
          import urllib.request
          import re
          import json
          from datetime import datetime, timezone

          url = "https://www.sih.gov.in/sih2026PS"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              html = urllib.request.urlopen(req, timeout=30).read().decode(
                  "utf-8", errors="ignore"
              )

              pos = html.find("SIH26033")

              if pos == -1:
                  raise Exception("SIH26033 not found")

              section = html[max(0, pos-5000):pos+10000]

              patterns = [
                  r"Submitted Idea\(s\) Count[\s\S]{0,300}?(\d{1,3})",
                  r"Submitted Ideas?[\s\S]{0,300}?(\d{1,3})"
              ]

              count = None

              for pattern in patterns:
                  match = re.search(pattern, section, re.I)
                  if match:
                      count = int(match.group(1))
                      break

              if count is None:
                  raise Exception("Submission count not found")

              data = {
                  "ps": "SIH26033",
                  "count": count,
                  "fetchedAt": datetime.now(timezone.utc).isoformat(),
                  "source": "SIH public portal"
              }

              with open("data/sih26033.json", "w") as f:
                  json.dump(data, f, indent=2)

              print("Updated count:", count)

          except Exception as e:
              print("ERROR:", e)
              raise
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sih26033.json

          git diff --cached --quiet || git commit -m "Update SIH26033 submission count"

          git push
